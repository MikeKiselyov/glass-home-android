# Tests on every pull request and every push to main. After a merge to main
# that changes the app, a release: the next version (scripts/dev/next-version.sh),
# built and signed with the release key, checked, tagged and published with
# glass-home.apk. TVs on 0.4.0 or later then find it and ask before installing.
#
# Secrets for the release (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64  base64 of glass-home-release.jks
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Actions are pinned to commit SHAs (the tag in a comment): the release job holds
# the signing key, and a tag can be moved. Dependabot proposes updates. The
# runners come with the Android SDK (ANDROID_HOME); Gradle fetches what is missing.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run again by hand (Actions > CI > Run workflow), e.g. after a failed release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest

  release:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time: two quick merges must not pick the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Did the app change since the last release?
        id: changed
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Docs, pictures and scripts don't need a new APK.
          if git diff --quiet "$latest" HEAD -- app build.gradle.kts settings.gradle.kts gradle.properties gradle; then
            echo "No change to the app since $latest; no release."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Version
        if: steps.changed.outputs.app == 'true'
        id: version
        run: |
          version=$(scripts/dev/next-version.sh)
          name=${version% *}
          code=${version#* }
          if git rev-parse -q --verify "refs/tags/v$name" > /dev/null; then
            echo "Tag v$name exists already." >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Releasing $name (versionCode $code)"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.changed.outputs.app == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.changed.outputs.app == 'true'
      - name: Release key
        if: steps.changed.outputs.app == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The release key secrets are not set; see the top of this file." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build
        if: steps.changed.outputs.app == 'true'
        run: ./gradlew assembleRelease -PreleaseVersionName=${{ steps.version.outputs.name }} -PreleaseVersionCode=${{ steps.version.outputs.code }}
      - name: Check the signature
        if: steps.changed.outputs.app == 'true'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          ls -l app/build/outputs/apk/release/
          # The newest build-tools that has apksigner.
          apksigner=""
          for folder in $(ls -d "$ANDROID_HOME"/build-tools/* | sort -V); do
            if [ -x "$folder/apksigner" ]; then
              apksigner="$folder/apksigner"
            fi
          done
          if [ -z "$apksigner" ]; then
            echo "No apksigner in $ANDROID_HOME/build-tools" >&2
            exit 1
          fi
          echo "Using $apksigner"
          mkdir -p out
          # Certificates are public: the whole output goes to the log.
          "$apksigner" verify --print-certs "$apk" > out/certs.txt
          cat out/certs.txt
          # "Signer #1 certificate SHA-256 digest: ..." up to build-tools 36, "V2 Signer: certificate SHA-256 digest: ..." from 37.
          certificate=$(sed -n 's/^.*[Ss]igner.*certificate SHA-256 digest: //p' out/certs.txt | head -1)
          # The release key's certificate (docs/RELEASING.md). Anything else would never install over a release.
          if [ "$certificate" != "952f6d18b0ce7c4b6c77ae4e00a9b5aac9576c3666ec604a4f9e060440e7afc6" ]; then
            echo "Signed with another key: $certificate" >&2
            exit 1
          fi
          cp "$apk" out/glass-home.apk
      - name: Publish
        if: steps.changed.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          sum=$(sha256sum out/glass-home.apk | cut -c1-64)
          {
            echo "Install: \`scripts/setup.sh --apk glass-home.apk\` (backs up the TV first, undo with \`scripts/restore.sh\`; \`--only glasshome\` for Glass Home alone), or \`scripts/install/install-apk.sh glass-home.apk\` for the app and nothing else. Step by step: docs/INSTALL.md."
            echo
            echo "Already on 0.4.0 or later? Glass Home finds this release by itself and asks before installing it."
            echo
            echo "SHA-256 of glass-home.apk: \`$sum\`"
          } > out/notes.md
          gh release create "v$VERSION" out/glass-home.apk --target "$GITHUB_SHA" --title "Glass Home $VERSION" --notes-file out/notes.md --generate-notes
      - name: Remove the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
