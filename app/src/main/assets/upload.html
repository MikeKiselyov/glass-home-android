<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171b20" media="(prefers-color-scheme: dark)">
<title>Glass Home</title>
<style>
  /* The website's own type: Bricolage Grotesque for headings and numbers,
     Atkinson Hyperlegible for everything you read. The clock fonts are the TV's. */
  @font-face { font-family: "Bricolage Grotesque"; src: url(/fonts/bricolage.ttf) format("truetype"); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: "Atkinson Hyperlegible"; src: url(/fonts/atkinson.ttf) format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Atkinson Hyperlegible"; src: url(/fonts/atkinson-bold.ttf) format("truetype"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Instrument Serif"; src: url(/fonts/instrument.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(/fonts/instrument-italic.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "DM Serif Display"; src: url(/fonts/dmserif.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Bebas Neue"; src: url(/fonts/bebas.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Space Mono"; src: url(/fonts/spacemono.ttf) format("truetype"); font-display: swap; }

  /* ---------- tokens: light by day, dark at night (follows the phone), always dark on the TV ---------- */
  :root {
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 24px; --space-2xl: 32px; --space-3xl: 48px;
    --radius: 14px; --radius-sm: 10px;
    --ground: oklch(96.5% 0.008 85);
    --surface: oklch(99.2% 0.004 85);
    --raised: oklch(92.5% 0.01 85);
    --ink: oklch(23% 0.015 250);
    --muted: oklch(47% 0.015 250);
    --line: oklch(87% 0.01 85);
    --pick: oklch(23% 0.015 250);
    --pick-ink: oklch(97% 0.008 85);
    --ring: oklch(60% 0.17 60);
    --live: oklch(52% 0.13 150);
    --danger: oklch(52% 0.17 28);
    --danger-ink: oklch(98% 0.01 28);
    color-scheme: light;
  }
  /* Dark: by the phone's setting, unless the sun/moon button picked one (data-theme). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: oklch(19% 0.012 250);
      --surface: oklch(23.5% 0.014 250);
      --raised: oklch(28% 0.014 250);
      --ink: oklch(95% 0.008 85);
      --muted: oklch(73% 0.012 250);
      --line: oklch(33% 0.014 250);
      --pick: oklch(93% 0.02 85);
      --pick-ink: oklch(21% 0.015 250);
      --ring: oklch(84% 0.15 80);
      --live: oklch(78% 0.13 150);
      --danger: oklch(72% 0.15 28);
      --danger-ink: oklch(20% 0.02 28);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"], body.tv {
    --ground: oklch(19% 0.012 250); --surface: oklch(23.5% 0.014 250); --raised: oklch(28% 0.014 250);
    --ink: oklch(95% 0.008 85); --muted: oklch(73% 0.012 250); --line: oklch(33% 0.014 250);
    --pick: oklch(93% 0.02 85); --pick-ink: oklch(21% 0.015 250); --ring: oklch(84% 0.15 80);
    --live: oklch(78% 0.13 150); --danger: oklch(72% 0.15 28); --danger-ink: oklch(20% 0.02 28);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 88px; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--body); }
  h1, h2, h3 { font-family: var(--display); letter-spacing: -.015em; margin: 0; }
  h1 { font-weight: 800; font-size: 26px; }
  h2 { font-weight: 700; font-size: 20px; margin: var(--space-2xl) 0 var(--space-sm); }
  .tab-panel > h2:first-child, .tab-panel > section:first-child > h2:first-child { margin-top: var(--space-lg); }
  .hint { color: var(--muted); font-size: 14px; margin: calc(-1 * var(--space-xs)) 0 var(--space-md); max-width: 60ch; }
  .status { color: var(--muted); font-size: 14px; margin: var(--space-sm) 0 0; min-height: 1.4em; }
  .status.error { color: var(--danger); }
  .num { font-family: var(--display); font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

  /* ---------- page ---------- */
  .shell { max-width: 720px; margin: 0 auto; padding: 0 var(--space-lg) var(--space-3xl); }
  /* On a phone the side part is not a box of its own, so the tabs can stick to the top of the whole page. */
  .side { display: contents; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: calc(var(--space-lg) + env(safe-area-inset-top, 0px)) 0 var(--space-md); }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--live); font-weight: 700; font-size: 13px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .bar-end { display: flex; align-items: center; gap: var(--space-md); }
  .scheme { width: 40px; height: 40px; border-radius: 12px; padding: 0; display: grid; place-items: center; background: var(--raised); color: var(--ink); }
  .scheme svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .scheme .moon { display: none; }
  :root[data-scheme-now="dark"] .scheme .sun { display: none; }
  :root[data-scheme-now="dark"] .scheme .moon { display: block; }
  body.tv .scheme { display: none; }

  /* The live preview: the TV's photo with the clock, date, weather and dock drawn on top. */
  .preview { position: relative; margin: 0; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden; background: oklch(35% 0.03 240);
    outline: 1px solid var(--line); }
  .preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview .pv { position: absolute; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.45); line-height: 1; white-space: nowrap; }
  .preview .pv-time { left: 7%; bottom: 24%; font-size: clamp(30px, 11vw, 64px); }
  .preview .pv-date { left: 7.5%; bottom: 15%; font: italic 11px/1 var(--serif); }
  .preview .pv-weather { right: 5%; top: 8%; font: 500 11px/1 var(--body); }
  .preview .pv-dock { left: 7%; bottom: 5%; display: flex; gap: 4px; }
  .preview .pv-dock i { width: 12px; height: 12px; border-radius: 3px; background: rgba(255,255,255,.9); display: block; }

  /* The tabs stay at the top while the page scrolls; the preview scrolls away with it. */
  .tabs { position: sticky; top: 0; z-index: 5; background: var(--ground); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: calc(var(--space-md) + env(safe-area-inset-top, 0px)) 0 var(--space-sm); }
  .tabs button { font: 700 14px/1 var(--body); color: var(--muted); background: var(--raised); border: 0; border-radius: 12px; padding: 12px 0; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--pick); color: var(--pick-ink); }

  /* ---------- controls ---------- */
  button, .button { font: 700 15px/1 var(--body); border: 0; border-radius: 12px; cursor: pointer; }
  .button { display: inline-flex; align-items: center; gap: var(--space-sm); padding: 14px 20px; background: var(--pick); color: var(--pick-ink); }
  .quiet { background: var(--raised); color: var(--ink); padding: 10px 14px; }
  button:disabled { opacity: .35; cursor: default; }
  .file-button { position: relative; overflow: hidden; }
  .file-button input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
  input[type=text], input[type=url], select {
    font: 400 16px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 12px 14px; width: 100%; min-width: 0; }
  /* Times and numbers in Bricolage: Atkinson's slashed zero turns 22:00 into 22:ØØ. */
  select { font-family: var(--display); font-variant-numeric: tabular-nums; }
  .inline { display: flex; gap: var(--space-sm); }

  /* Tiles: a picture and a name; the filled one is the current choice. */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-sm); }
  .tile { position: relative; display: block; background: var(--surface); border-radius: var(--radius); padding: var(--space-sm); outline: 1px solid var(--line); cursor: pointer; }
  .tile input { position: absolute; opacity: 0; pointer-events: none; }
  .tile .name { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; padding: 2px 2px 0; }
  .tile .note { display: block; color: var(--muted); font-size: 12.5px; padding: 0 2px; line-height: 1.35; }
  .tile.checked { outline: 2px solid var(--pick); background: var(--raised); }
  .tile.checked .name::after { content: "✓"; }
  .tile.focused { outline: 3px solid var(--ring); outline-offset: 2px; }

  /* The theme sketches sit on the photo that is on the TV now. */
  .shot { display: block; position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 6px;
    background: oklch(38% 0.03 240) var(--screen-photo, none) center / cover; }
  .shot b, .shot i { position: absolute; display: block; }
  .shot .digits { left: 8%; bottom: 12%; color: #fff; font: 400 20px/1 var(--serif); text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  .shot .dockbar { left: 8%; right: 8%; bottom: 10%; height: 18%; border-radius: 5px; background: rgba(255,255,255,.35); }
  .shot.postcard { background: oklch(27% 0.01 240); }
  .shot .card { right: 8%; top: 13%; width: 56%; height: 70%; background: #f3efe7 var(--screen-photo, none) center / cover; border: 3px solid #f3efe7; transform: rotate(-3deg); }
  .shot .menu { left: 8%; top: 22%; width: 22%; height: 52%; background: repeating-linear-gradient(#fff 0 3px, transparent 3px 12px); opacity: .8; }
  .shot .words { left: 8%; bottom: 12%; color: #fff; font: 700 12px/1 var(--serif); white-space: nowrap; text-shadow: 0 1px 6px rgba(0,0,0,.4); }

  .font-sample { display: block; font-size: 34px; line-height: 1.1; padding: 6px 4px 2px; }
  .weather-sample { display: block; position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 6px; color: #fff;
    background: oklch(38% 0.03 240) var(--screen-photo, none) center / cover; font: 400 11px/1.2 var(--body); text-shadow: 0 1px 6px rgba(0,0,0,.45); }
  .weather-sample .by-date { position: absolute; left: 8%; bottom: 12%; display: flex; align-items: center; gap: 4px; font-style: italic; white-space: nowrap; }
  .weather-sample .in-corner { position: absolute; right: 6%; top: 8%; text-align: right; }
  .weather-sample .big { font-size: 20px; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .weather-sample .small, .weather-sample .days { font-size: 9px; opacity: .9; }
  .weather-sample .panel { display: flex; gap: 1px; margin-top: 3px; padding: 3px 4px; border-radius: 5px; background: rgba(255,255,255,.22); }
  .weather-sample .col { display: flex; flex-direction: column; align-items: center; font-size: 7px; line-height: 1.25; width: 12px; }
  .weather-sample .col .sun { color: #ffd43b; }
  .weather-sample .small-sans { font-size: 10px; }
  .weather-sample svg { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Rows: one setting per line, the control on the right. */
  .rows { background: var(--surface); border-radius: var(--radius); outline: 1px solid var(--line); overflow: hidden; margin-top: var(--space-md); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-md); padding: 12px var(--space-md); border-top: 1px solid var(--line); min-height: 56px; }
  .row:first-child { border-top: 0; }
  .row > label:first-child, .row > span:first-child { flex: 1; }
  .row select { width: auto; max-width: 55%; }
  .hours { display: flex; gap: 6px; align-items: center; }
  .hours select { max-width: none; }

  .segments { display: inline-flex; background: var(--raised); border-radius: 11px; padding: 3px; gap: 2px; }
  .segments label { position: relative; font: 700 13px/1 var(--display); padding: 9px 12px; border-radius: 9px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .segments input { position: absolute; opacity: 0; pointer-events: none; }
  .segments label.checked { background: var(--pick); color: var(--pick-ink); }
  .segments label.focused { outline: 3px solid var(--ring); outline-offset: 1px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { position: relative; padding: 10px 14px; border-radius: 11px; background: var(--surface); outline: 1px solid var(--line); cursor: pointer; font: 400 15px/1.2 var(--display); font-variant-numeric: tabular-nums; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips label.checked { background: var(--pick); color: var(--pick-ink); outline-color: var(--pick); }
  .chips label.focused { outline: 3px solid var(--ring); outline-offset: 2px; }

  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--raised); transition: background .2s; }
  .switch span::after { content: ""; position: absolute; left: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .2s cubic-bezier(.22, 1, .36, 1), background .2s; }
  .switch input:checked + span { background: var(--pick); }
  .switch input:checked + span::after { transform: translateX(20px); background: var(--pick-ink); }
  .switch input:focus-visible + span { outline: 3px solid var(--ring); outline-offset: 2px; }

  /* ---------- photos ---------- */
  .upload-row { display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap; }
  .progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: var(--space-md); }
  .progress span { display: block; height: 100%; width: 0; background: var(--pick); transition: width .2s; }
  .photo-grid { list-style: none; padding: 0; margin: var(--space-md) 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  .photo-grid li { position: relative; border-radius: var(--radius-sm); overflow: hidden; background: var(--raised); aspect-ratio: 1; touch-action: pan-y; }
  .photo-grid li img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-select: none; user-select: none; }
  .photo-grid li.dragging { opacity: .35; }
  .photo-grid li .handle, .photo-grid li .remove { position: absolute; top: 6px; width: 34px; height: 34px; border-radius: 10px; padding: 0;
    background: rgba(18, 22, 26, .6); color: #fff; font-size: 15px; display: grid; place-items: center; }
  .photo-grid li .handle { left: 6px; cursor: grab; touch-action: none; }
  .photo-grid li .remove { right: 6px; }
  .photo-grid li .remove.armed { width: auto; padding: 0 10px; background: var(--danger); color: var(--danger-ink); font-size: 13px; }
  .photo-grid li .number { position: absolute; left: 8px; bottom: 6px; color: #fff; font: 700 14px/1 var(--display); text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  .drag-ghost { position: fixed; z-index: 20; pointer-events: none; border-radius: var(--radius-sm); overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.4); transform: scale(1.05); }
  .drag-ghost img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- apps ---------- */
  .dock-list { list-style: none; padding: 0; margin: var(--space-md) 0 0; background: var(--surface); border-radius: var(--radius); outline: 1px solid var(--line); overflow: hidden; }
  .dock-list li { display: flex; align-items: center; gap: 6px; padding: 8px var(--space-md); border-top: 1px solid var(--line); min-height: 56px; }
  .dock-list li:first-child { border-top: 0; }
  .dock-list li > span { flex: 1; font-size: 16px; }
  .dock-list li.hidden > span { color: var(--muted); text-decoration: line-through; }
  .dock-list button { min-width: 40px; height: 40px; padding: 0 12px; font-size: 15px; }

  /* ---------- more ---------- */
  .results { display: grid; gap: 6px; margin-top: var(--space-md); }
  .results button { text-align: left; padding: 14px; }
  .icon-grid { list-style: none; padding: 0; margin: var(--space-md) 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: var(--space-md); }
  .icon-grid li { text-align: center; }
  .icon-grid img { width: 100%; aspect-ratio: 1; border-radius: 22%; display: block; background: var(--raised); }
  .icon-grid button { margin-top: 6px; }
  .icon-grid .remove.armed { background: var(--danger); color: var(--danger-ink); }
  footer { color: var(--muted); font-size: 13px; padding-top: var(--space-3xl); max-width: 60ch; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); opacity: 0;
    background: var(--pick); color: var(--pick-ink); padding: 12px 20px; border-radius: 999px; font-weight: 700; transition: opacity .2s, transform .25s cubic-bezier(.22, 1, .36, 1); pointer-events: none; z-index: 30; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  #signin { padding-top: var(--space-xl); }
  #signin input { font: 700 32px var(--display); letter-spacing: .2em; text-align: center; }

  /* ---------- on the TV: two columns, the remote's focus ring is the loudest thing ---------- */
  .tv-only { display: none; }
  body.tv .tv-only { display: block; }
  body.tv .file-button, body.tv .photo-grid li .handle { display: none; }
  body.tv .shell { max-width: none; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 0 var(--space-2xl); padding: 0 var(--space-2xl); }
  body.tv .side { display: block; position: sticky; top: 0; height: 100vh; padding-top: var(--space-lg); }
  body.tv .tabs { position: static; grid-template-columns: 1fr; gap: 6px; padding-top: var(--space-md); }
  body.tv .tabs button { text-align: left; padding: 14px 16px; font-size: 16px; }
  body.tv .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  body.tv #fonts, body.tv #weather-styles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  body.tv :focus-visible, body.tv :focus { outline: 4px solid var(--ring); outline-offset: 3px; }
  body.tv .tile input:focus, body.tv .segments input:focus, body.tv .chips input:focus { outline: none; }
  body.tv .tile.focused { outline-width: 4px; outline-offset: 3px; }
  body.tv main { padding-bottom: 40vh; }

  @media (prefers-reduced-motion: reduce) {
    .switch span, .switch span::after, .toast { transition: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <header class="bar">
      <h1 data-i18n="web.brand"></h1>
      <span class="bar-end">
        <span class="live" id="live" hidden data-i18n="web.live"></span>
        <button type="button" class="scheme" id="scheme">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </span>
    </header>
    <figure class="preview" id="preview" hidden data-i18n-aria-label="web.preview">
      <img id="preview-photo" alt="">
      <span class="pv pv-time" id="pv-time"></span>
      <span class="pv pv-date" id="pv-date"></span>
      <span class="pv pv-weather" id="pv-weather"></span>
      <span class="pv pv-dock" id="pv-dock"></span>
    </figure>
    <div class="tabs" id="tabs" role="tablist" hidden data-i18n-aria-label="web.sections">
      <button type="button" role="tab" id="tab-look" aria-controls="panel-look" data-tab="look" data-i18n="web.tab.look"></button>
      <button type="button" role="tab" id="tab-photos" aria-controls="panel-photos" data-tab="photos" data-i18n="web.tab.photos"></button>
      <button type="button" role="tab" id="tab-apps" aria-controls="panel-apps" data-tab="apps" data-i18n="web.tab.apps"></button>
      <button type="button" role="tab" id="tab-more" aria-controls="panel-more" data-tab="more" data-i18n="web.tab.more"></button>
    </div>
  </aside>

  <div class="content">
    <main id="signin" hidden>
      <h2 data-i18n="web.signin_title"></h2>
      <p class="hint" data-i18n="web.signin_help"></p>
      <form id="signin-form" class="inline">
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" data-i18n-aria-label="web.code_label">
        <button type="submit" class="button" data-i18n="web.signin"></button>
      </form>
      <p id="signin-status" class="status error" role="status"></p>
    </main>

    <main id="app" hidden>
      <!-- ===== Look ===== -->
      <section class="tab-panel" id="panel-look" data-tab="look" role="tabpanel" aria-labelledby="tab-look">
        <h2 data-i18n="web.look.theme"></h2>
        <div class="tiles" id="themes" role="radiogroup" data-i18n-aria-label="web.look.theme"></div>

        <div class="rows">
          <div class="row"><span data-i18n="web.look.clock"></span><div class="segments" id="clock-format" role="radiogroup" data-i18n-aria-label="web.look.clock"></div></div>
        </div>

        <h2 data-i18n="web.look.font"></h2>
        <div class="tiles" id="fonts" role="radiogroup" data-i18n-aria-label="web.look.font"></div>

        <h2 data-i18n="web.look.date"></h2>
        <div class="chips" id="dates" role="radiogroup" data-i18n-aria-label="web.look.date"></div>

        <h2 data-i18n="web.look.weather"></h2>
        <div class="tiles" id="weather-styles" role="radiogroup" data-i18n-aria-label="web.look.weather"></div>

        <h2 data-i18n="web.look.night"></h2>
        <p class="hint" data-i18n="web.look.night_lead"></p>
        <div class="rows">

        <p class="hint tv-only" data-i18n="web.tv.photos_from_phone"></p>

        <div class="rows">
          <div class="row"><label for="shuffle" data-i18n="web.photos.shuffle"></label><span class="switch"><input type="checkbox" id="shuffle"><span></span></span></div>
          <div class="row"><label for="interval" data-i18n="web.look.interval"></label>
            <select id="interval">
              <option value="15" data-i18n="web.interval.15"></option><option value="30" data-i18n="web.interval.30"></option><option value="45" data-i18n="web.interval.45"></option>
              <option value="60" data-i18n="web.interval.60"></option><option value="120" data-i18n="web.interval.120"></option><option value="300" data-i18n="web.interval.300"></option><option value="600" data-i18n="web.interval.600"></option>

      <!-- ===== More: weather, shared album, icons ===== -->

      <section id="weather">
        <h2 data-i18n="web.weather.title"></h2>
        <p class="hint" id="weather-now"></p>
        <form id="weather-form" class="inline">
          <input id="weather-query" type="text" data-i18n-placeholder="web.weather.placeholder" data-i18n-aria-label="web.weather.city" autocomplete="address-level2">
          <button type="submit" class="button" data-i18n="web.weather.find"></button>
        </form>
        <div id="weather-results" class="results"></div>
        <p><button id="weather-toggle" type="button" class="quiet"></button></p>
        <p class="status" data-i18n="web.weather.credit"></p>

      <section id="album">
        <h2 data-i18n="web.album.title"></h2>

          <input id="album-link" type="url" placeholder="https://www.icloud.com/sharedalbum/#…" data-i18n-aria-label="web.album.label">
          <button type="submit" class="button" data-i18n="web.album.save"></button>

        <label class="button file-button"><span aria-hidden="true">＋</span><span data-i18n="web.icons.add"></span><input id="icon-files" type="file" accept="image/*" multiple></label>
        <p class="hint tv-only" data-i18n="web.tv.icons_from_phone"></p>

    </main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // Sizes the TV shows photos at: landscape photos cover 1920x1080, portrait ones fill 1080 px of height.
  var SCREEN_WIDTH = 1920;
  var SCREEN_HEIGHT = 1080;
  var PORTRAIT_BELOW = 1.25;
  var PARALLEL_UPLOADS = 2;

  // Sketches of each theme, drawn over the photo that is on the TV now.
  var THEMES = [
    { id: 'clock', drawing: '<i class="digits">{time}</i>' },
    { id: 'glass', drawing: '<b class="dockbar"></b>' },
    { id: 'postcard', drawing: '<b class="menu"></b><b class="card"></b>' },
    { id: 'type', drawing: '<i class="words">YouTube&nbsp; Netflix&nbsp; Spotify</i>' }
  ];
  var CLOCK_FORMATS = [
    { id: '24', key: 'web.look.clock_24_short' },
    { id: '12', key: 'web.look.clock_12_short' },
    { id: 'auto', key: 'web.look.clock_auto_short' }
  ];
  var FONTS = [
    { id: 'instrument', name: 'Instrument Serif', family: '"Instrument Serif", serif', weight: 400 },
    { id: 'dmserif', name: 'DM Serif Display', family: '"DM Serif Display", serif', weight: 400 },
    { id: 'bebas', name: 'Bebas Neue', family: '"Bebas Neue", sans-serif', weight: 400 },
    { id: 'spacemono', name: 'Space Mono', family: '"Space Mono", monospace', weight: 400 },
    { id: 'modern', name: 'Modern', family: 'Roboto, -apple-system, "Helvetica Neue", sans-serif', weight: 300 }
  ];
  var DATE_FORMATS = ['words', 'long', 'short', 'dmy', 'mdy', 'iso'];
  var WEATHER_STYLES = ['week', 'line', 'compact', 'minimal', 'corner', 'forecast'];
  // The TV's sun icon (res/drawable/weather_sun.xml), for the previews.
  var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';

  // Text for markup built as a string: <, >, &, " and ' as entities.
  function escapeHtml(text) {
    var entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(text).replace(/[&<>"']/g, function (character) { return entities[character]; });
  }

  // The city the TV shows the weather for ("Porto, Portugal" -> "Porto").
  // Any signed-in phone can name the place, so it is escaped before it goes into the samples.
  function sampleCity() {
    if (weatherData.place) {
      return escapeHtml(weatherData.place.split(',')[0]);
    }
    return '…';
  }

  function capitalised(text) {
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function weatherSample(style) {
    var sun = SUN;
    if (style === 'week') {
      var columns = '';
      for (var day = 1; day <= 7; day++) {
        var weekday = STRINGS['date.weekdays_short'][day % 7].slice(0, 2);
        var temperature = '2' + (day % 5) + '°';
        columns += '<span class="col"><span>' + weekday + '</span><span class="sun">' + sun + '</span><span>' + temperature + '</span></span>';
      }
      var summary = '20° ' + capitalised(t('weather.0'));
      return '<span class="in-corner week"><span class="small-sans">' + summary + '</span><span class="panel">' + columns + '</span></span>';
    }
    if (style === 'line') {
      var line = t('weather.line', { temperature: 20, description: t('weather.0'), city: sampleCity() });
      return '<span class="by-date">' + line + '</span>';
    }
    if (style === 'compact') {
      return '<span class="by-date">' + sun + ' 20°</span>';
    }
    if (style === 'minimal') {
      return '<span class="by-date">20°</span>';
    }
    var corner = '<span class="in-corner"><span class="big">' + sun + ' 20°</span>';
    corner += '<span class="small">' + t('weather.corner', { description: t('weather.0'), city: sampleCity() }) + '</span>';
    if (style === 'forecast') {
      corner += '<span class="days">' + STRINGS['date.weekdays_short'].slice(1, 4).join(' · ') + '</span>';
    }
    return corner + '</span>';
  }

  var settings = {};
  var STRINGS = {};

  var weatherData = {};
  var dockData = { items: [] };

  // All text comes from the TV's language file (assets/i18n): t(name, values) with {name} placeholders.
  function t(key, values) {
    values = values || {};
    var lookup = key;
    if (values.count === 1 && STRINGS[key + '_one'] !== undefined) lookup = key + '_one';
    var text = STRINGS[lookup];
    if (text === undefined) return key;
    Object.keys(values).forEach(function (name) {
      text = text.split('{' + name + '}').join(String(values[name]));
    });
    return text;
  }

  function applyStaticText() {
    document.documentElement.lang = settings.language || 'en';
    document.querySelectorAll('[data-i18n]').forEach(function (element) { element.textContent = t(element.dataset.i18n); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (element) { element.placeholder = t(element.dataset.i18nPlaceholder); });
    document.querySelectorAll('[data-i18n-aria-label]').forEach(function (element) { element.setAttribute('aria-label', t(element.dataset.i18nAriaLabel)); });
  }

  // ---------- helpers ----------

  function $(id) { return document.getElementById(id); }

  function api(path, body) {
    var options = { credentials: 'same-origin', headers: { 'X-Glass-Home': '1' } };
    if (body !== undefined) {
      options.method = 'POST';
      options.body = body;
    }
    return fetch(path, options).then(function (response) {
      if (response.status === 401) {
        showSignIn();
        throw new Error('signin');
      }
      return response;
    });
  }

  function json(response) { return response.json(); }

  function form(values) {
    var data = new URLSearchParams();
    Object.keys(values).forEach(function (key) { data.set(key, values[key]); });
    return data;
  }

  var toastTimer = null;
  function toast(text) {
    var element = $('toast');
    element.textContent = text;
    element.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { element.classList.remove('on'); }, 2200);
  }

  function pad(number) { return (number < 10 ? '0' : '') + number; }

  // The same formats as the TV draws (MainActivity.formatDate), from the same language file.
  function dateSample(format, date) {
    var day = date.getDate();
    var weekday = STRINGS['date.weekdays'][date.getDay()];
    var month = STRINGS['date.months'][date.getMonth()];
    if (format === 'words') return t('date.words', { weekday: weekday, ordinal: STRINGS['date.ordinals'][day - 1], month: month });
    if (format === 'long') return t('date.long', { weekday: weekday, day: day, month: month });
    if (format === 'short') return t('date.short', { weekday: STRINGS['date.weekdays_short'][date.getDay()], day: day, month: STRINGS['date.months_short'][date.getMonth()] });
    if (format === 'dmy') return pad(day) + '.' + pad(date.getMonth() + 1) + '.' + date.getFullYear();
    if (format === 'mdy') return pad(date.getMonth() + 1) + '/' + pad(day) + '/' + date.getFullYear();
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(day);
  }

  // ---------- sign in ----------

  function showSignIn() {
    $('app').hidden = true;
    $('preview').hidden = true;
    $('tabs').hidden = true;
    $('live').hidden = true;
    $('signin').hidden = false;
  }

  function showApp() {
    $('signin').hidden = true;
    $('app').hidden = false;
    $('preview').hidden = false;
    $('tabs').hidden = false;
    $('live').hidden = false;
  }

  function signIn(code) {
    return fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'X-Glass-Home': '1' }, body: form({ code: code }) })
      .then(function (response) {
        if (response.ok) return true;
        return response.json().then(function (result) {
          $('signin-status').textContent = result.error === 'locked'
            ? t('web.locked', { minutes: result.minutes })
            : t('web.wrong_code');
          return false;
        });
      });
  }

  $('signin-form').addEventListener('submit', function (event) {
    event.preventDefault();
    signIn($('code').value.trim()).then(function (ok) { if (ok) loadAll(); });
  });

  // ---------- photos ----------

  function loadPhotos() {
    return api('/api/photos').then(json).then(renderPhotos);
  }

  function renderPhotos(data) {
    var grid = $('photo-grid');
    grid.textContent = '';
    var photos = data.photos || [];
    $('photos-empty').hidden = photos.length > 0;
    photos.forEach(function (photo, index) {
      var item = document.createElement('li');
      item.dataset.key = photo.name;

      var image = document.createElement('img');
      image.src = '/api/thumb/' + encodeURIComponent(photo.name);
      image.alt = '';
      image.loading = 'lazy';
      image.decoding = 'async';
      item.appendChild(image);

      var number = document.createElement('span');
      number.className = 'number';
      number.textContent = String(index + 1);
      item.appendChild(number);

      var handle = document.createElement('button');
      handle.type = 'button';
      handle.className = 'handle';
      handle.textContent = '⠿';
      handle.setAttribute('aria-label', t('web.photos.move', { number: index + 1 }));
      handle.addEventListener('pointerdown', function (event) { startDrag(event, item); });
      handle.addEventListener('keydown', function (event) { keyMove(event, item); });
      item.appendChild(handle);

      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove';
      remove.textContent = '✕';
      remove.setAttribute('aria-label', t('web.photos.delete', { number: index + 1 }));
      remove.addEventListener('click', function () {
        api('/api/delete', form({ name: photo.name })).then(loadPhotos).then(function () { toast(t('web.photos.deleted')); });
      });
      item.appendChild(remove);

      grid.appendChild(item);
    });
  }

  function renumber() {
    var items = $('photo-grid').children;
    for (var index = 0; index < items.length; index++) {
      items[index].querySelector('.number').textContent = String(index + 1);
    }
  }

  function saveOrder() {
    var names = [];
    var items = $('photo-grid').children;
    for (var index = 0; index < items.length; index++) {
      names.push(items[index].dataset.key);
    }
    renumber();
    return api('/api/photo-order', form({ names: names.join(',') })).then(function () { toast(t('web.photos.order_saved')); });
  }

  // Drag by the handle with a finger or a mouse (pointer events work on iPhone too).
  function startDrag(event, item) {
    event.preventDefault();
    var grid = $('photo-grid');
    var box = item.getBoundingClientRect();
    var ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.style.width = box.width + 'px';
    ghost.style.height = box.height + 'px';
    ghost.appendChild(item.querySelector('img').cloneNode());
    document.body.appendChild(ghost);
    var offsetX = event.clientX - box.left;
    var offsetY = event.clientY - box.top;
    var startOrder = Array.prototype.indexOf.call(grid.children, item);
    item.classList.add('dragging');

    function place(x, y) {
      ghost.style.left = (x - offsetX) + 'px';
      ghost.style.top = (y - offsetY) + 'px';
    }
    place(event.clientX, event.clientY);

    function move(moveEvent) {
      place(moveEvent.clientX, moveEvent.clientY);
      var under = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY);
      var target = under ? under.closest('#photo-grid li') : null;
      if (target && target !== item) {
        var targetBox = target.getBoundingClientRect();
        var after = moveEvent.clientX > targetBox.left + targetBox.width / 2;
        grid.insertBefore(item, after ? target.nextSibling : target);
      }
      // Scroll the page when dragging near the top or bottom edge.
      if (moveEvent.clientY < 80) window.scrollBy(0, -12);
      if (moveEvent.clientY > window.innerHeight - 80) window.scrollBy(0, 12);
    }

    function end() {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', end);
      document.removeEventListener('pointercancel', end);
      ghost.remove();
      item.classList.remove('dragging');
      if (Array.prototype.indexOf.call(grid.children, item) !== startOrder) saveOrder();
    }

    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);
  }

  function keyMove(event, item) {
    var grid = $('photo-grid');
    if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
      if (!item.previousElementSibling) return;
      grid.insertBefore(item, item.previousElementSibling);
    } else if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
      if (!item.nextElementSibling) return;
      grid.insertBefore(item.nextElementSibling, item);
    } else {
      return;
    }
    event.preventDefault();
    item.querySelector('.handle').focus();
    saveOrder();
  }

  // Resizes on the phone to exactly what the TV shows, so uploads are small
  // and the TV can keep the file as it is (no second compression).
  function prepare(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var image = new Image();
      image.onload = function () {
        var width = image.naturalWidth;
        var height = image.naturalHeight;
        var scale;
        if (width / height < PORTRAIT_BELOW) scale = SCREEN_HEIGHT / height;
        else scale = Math.max(SCREEN_WIDTH / width, SCREEN_HEIGHT / height);
        scale = Math.min(1, scale);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        var context = canvas.getContext('2d');
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob);
          else reject(new Error('encode'));
        }, 'image/jpeg', 0.92);
      };
      image.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('decode'));
      };
      image.src = url;
    });
  }

  function uploadPhotos(fileList) {
    var files = Array.prototype.slice.call(fileList);
    var total = files.length;
    var finished = 0;
    var added = 0;
    var failed = 0;
    var full = false;
    var bar = $('upload-progress');
    bar.hidden = false;
    bar.firstElementChild.style.width = '0';
    $('upload-status').textContent = t('web.photos.preparing', { count: total });

    function progress() {
      bar.firstElementChild.style.width = Math.round(finished / total * 100) + '%';
      $('upload-status').textContent = t('web.photos.progress', { done: finished, total: total });
    }

    function one(file) {
      return prepare(file).then(function (blob) {
        var data = new FormData();
        data.append('photo', blob, 'photo.jpg');
        return api('/api/upload', data).then(json);
      }).then(function (result) {
        if (result.error === 'full') full = true;
        added += result.added || 0;
        failed += result.rejected || 0;
      }, function () {
        failed += 1;
      }).then(function () {
        finished += 1;
        progress();
      });
    }

    function worker() {
      var file = files.shift();
      if (!file || full) return Promise.resolve();
      return one(file).then(worker);
    }

    var workers = [];
    for (var index = 0; index < PARALLEL_UPLOADS; index++) workers.push(worker());
    return Promise.all(workers).then(function () {
      bar.hidden = true;
      var text = t('web.photos.added', { count: added });
      if (failed) text += ' ' + t('web.photos.unreadable', { count: failed });
      if (full) text = t('web.photos.full');
      $('upload-status').textContent = text;
      toast(t('web.photos.added_toast', { count: added }));
      // New photos play first: the TV changes photo, so does the preview.
      setTimeout(loadScreenPhoto, 4000);
      return loadPhotos();
    });
  }

  $('files').addEventListener('change', function (event) {
    if (event.target.files.length) uploadPhotos(event.target.files);
    event.target.value = '';
  });

  $('shuffle').addEventListener('change', function (event) {
    saveSetting('shufflePhotos', event.target.checked ? '1' : '0').then(function () {
      toast(event.target.checked ? t('web.photos.shuffling') : t('web.photos.in_order'));
    });
  });

  // ---------- look ----------

  // A choice in a group (theme, font, date...): a label holding a hidden radio
  // button, so it works by touch, with a keyboard and with the TV remote.
  function choice(group, value, className, inner, checked) {
    var label = document.createElement('label');
    label.className = className;
    if (checked) {
      label.classList.add('checked');
    }
    var input = document.createElement('input');
    input.type = 'radio';
    input.name = group;
    input.value = value;
    input.checked = checked;
    input.addEventListener('focus', function () { label.classList.add('focused'); });
    input.addEventListener('blur', function () { label.classList.remove('focused'); });
    label.appendChild(input);
    var body = document.createElement('span');
    body.innerHTML = inner;
    while (body.firstChild) {
      label.appendChild(body.firstChild);
    }
    return label;
  }

  // Redrawing the groups would drop the keyboard focus: put it back on the same choice.
  function focusedChoice() {
    var active = document.activeElement;
    if (active && active.type === 'radio') {
      return { name: active.name, value: active.value };
    }
    return null;
  }

  function refocusChoice(remembered) {
    if (!remembered) {
      return;
    }
    var inputs = document.querySelectorAll('input[type=radio]');
    for (var index = 0; index < inputs.length; index++) {
      if (inputs[index].name === remembered.name && inputs[index].value === remembered.value) {
        inputs[index].focus({ preventScroll: true });
        return;
      }
    }
  }

  function renderLook() {
    var remembered = focusedChoice();
    drawLook();
    refocusChoice(remembered);
  }

  function drawLook() {
    var themes = $('themes');
    themes.textContent = '';
    THEMES.forEach(function (theme) {
      var drawing = theme.drawing.split('{time}').join(clockText(new Date()));
      var inner = '<span class="shot ' + theme.id + '" aria-hidden="true">' + drawing + '</span>' +
        '<span class="name">' + t('web.theme.' + theme.id) + '</span>' +
        '<span class="note">' + t('web.theme.' + theme.id + '_note') + '</span>';
      themes.appendChild(choice('theme', theme.id, 'tile', inner, settings.theme === theme.id));
    });

    var clockFormat = $('clock-format');
    clockFormat.textContent = '';
    CLOCK_FORMATS.forEach(function (format) {

  function squareIcon(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var image = new Image();
      image.onload = function () {
        var side = Math.min(image.naturalWidth, image.naturalHeight);
        var canvas = document.createElement('canvas');
        canvas.width = 312;
        canvas.height = 312;
        var context = canvas.getContext('2d');
        context.imageSmoothingQuality = 'high';
        context.drawImage(image, (image.naturalWidth - side) / 2, (image.naturalHeight - side) / 2, side, side, 0, 0, 312, 312);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) { if (blob) resolve(blob); else reject(new Error('encode')); }, 'image/png');
      };
      image.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      image.src = url;
    });
  }

  $('icon-files').addEventListener('change', function (event) {
    var files = Array.prototype.slice.call(event.target.files);
    event.target.value = '';
    var added = 0;

    function next() {
      var file = files.shift();
      if (!file) {
        $('icon-status').textContent = t('web.icons.added', { count: added });
        return loadIcons();
      }
      return squareIcon(file).then(function (blob) {
        var data = new FormData();
        data.append('icon', blob, 'icon.png');
        return api('/api/icon-upload', data).then(json).then(function (result) { added += result.added || 0; });
      }, function () { /* not an image: skip it */ }).then(next);
    }
    next();
  });

  // ---------- light and dark ----------

  // The phone's own setting until the sun/moon button is pressed; then the
  // choice is kept on this phone. The TV is always dark.
  var SCHEME_KEY = 'glasshome.scheme';
  var systemDark = window.matchMedia('(prefers-color-scheme: dark)');
  var chosenScheme = readScheme();

  function readScheme() {
    try {
      var saved = localStorage.getItem(SCHEME_KEY);
      if (saved === 'light' || saved === 'dark') {
        return saved;
      }
    } catch (blocked) {
      // Private browsing: nothing saved.
    }
    return null;
  }

  function schemeNow() {
    if (chosenScheme) {
      return chosenScheme;
    }
    return systemDark.matches ? 'dark' : 'light';
  }

  function applyScheme() {
    var root = document.documentElement;
    if (chosenScheme) {
      root.dataset.theme = chosenScheme;
    } else {
      delete root.dataset.theme;
    }
    var now = schemeNow();
    root.dataset.schemeNow = now;
    var color = '#f5f2ec';
    if (now === 'dark') {
      color = '#171b20';
    }
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var index = 0; index < metas.length; index++) {
      metas[index].setAttribute('content', color);
    }
    if (STRINGS['web.scheme.to_dark']) {
      var label = t('web.scheme.to_dark');
      if (now === 'dark') {
        label = t('web.scheme.to_light');
      }
      $('scheme').setAttribute('aria-label', label);
      $('scheme').title = label;
    }
  }

  $('scheme').addEventListener('click', function () {
    chosenScheme = schemeNow() === 'dark' ? 'light' : 'dark';
    try {
      localStorage.setItem(SCHEME_KEY, chosenScheme);
    } catch (blocked) {
      // Not saved, but the page still switches.
    }
    applyScheme();
  });

  if (systemDark.addEventListener) {
    systemDark.addEventListener('change', applyScheme);
  }

  // Right away, before the texts load: a saved dark choice must not flash light first.

  // ---------- tabs ----------

  // The address says which tab is open (#look, #photos, #apps, #more), so the
  // TV can open settings at Look and a reload keeps the tab.
  // Older links name sections: #dock is in Apps, #weather, #album and #icons in More.
  function tabFromAddress() {

      return 'photos';

    if (name === 'apps' || name === 'dock') {

  function showTab(tab) {

    }
    var panels = document.querySelectorAll('.tab-panel');
    for (var panelIndex = 0; panelIndex < panels.length; panelIndex++) {
      panels[panelIndex].hidden = panels[panelIndex].dataset.tab !== tab;
    }
    history.replaceState(null, '', location.pathname + '#' + tab);
    window.scrollTo(0, 0);

  // The TV screen as it is now: its photo, with the clock, date, weather and

  // ---------- TV mode: the page on the TV itself, worked with the remote ----------
  //
  // Arrow keys move to the nearest control in that direction, OK (Enter) picks
  // cards and flips switches, delete buttons want a second OK, and after the
  // page redraws a list the focus goes back to the same place.

  var IS_TV = navigator.userAgent.indexOf('GlassHomeTV') >= 0;

  function isShown(element) {
    if (element.disabled) {
      return false;
    }
    var box = boxOf(element);
    return box.width > 0 && box.height > 0;
  }

  // Radio buttons in theme cards are invisible: the card is what you see.
  function boxOf(element) {
    var shown = element;
    if (element.type === 'radio' || element.type === 'checkbox') {
      var label = element.closest('label');
      if (label) {
        shown = label;
      }
    }
    return shown.getBoundingClientRect();
  }

  function controls() {
    var all = document.querySelectorAll('a[href], button, input, select, textarea');
    var result = [];
    for (var index = 0; index < all.length; index++) {
      if (isShown(all[index])) {
        result.push(all[index]);
      }
    }
    return result;
  }

  function inSectionNav(element) {
    return element.closest('#tabs') !== null;
  }

  // How far a candidate is along the arrow, and how far off to the side.
  function distances(start, box, direction) {
    var startX = start.left + start.width / 2;
    var startY = start.top + start.height / 2;
    var x = box.left + box.width / 2;
    var y = box.top + box.height / 2;
    if (direction === 'ArrowRight') {
      return { along: box.left - start.right, sideways: Math.abs(y - startY) };
    }
    if (direction === 'ArrowLeft') {
      return { along: start.left - box.right, sideways: Math.abs(y - startY) };
    }
    if (direction === 'ArrowDown') {
      return { along: box.top - start.bottom, sideways: Math.abs(x - startX) };
    }
    return { along: start.top - box.bottom, sideways: Math.abs(x - startX) };
  }

  // The next control is the one most in line with the arrow: distance along it
  // counts once, sideways distance twice. The tabs stay on screen while the
  // page scrolls; going up or down they are only reached when nothing else is
  // that way (left from the content reaches them as usual).
  function nextControl(from, direction) {
    var start = boxOf(from);
    var fromNav = inSectionNav(from);
    var best = null;
    var bestScore = Infinity;
    var bestInNav = null;
    var bestInNavScore = Infinity;
    var candidates = controls();
    for (var index = 0; index < candidates.length; index++) {
      var candidate = candidates[index];
      if (candidate === from) {
        continue;
      }
      var distance = distances(start, boxOf(candidate), direction);
      if (distance.along < -1) {
        continue;
      }
      var score = Math.max(distance.along, 0) + distance.sideways * 2;
      var vertical = direction === 'ArrowUp' || direction === 'ArrowDown';
      if (vertical && inSectionNav(candidate) && !fromNav) {
        if (score < bestInNavScore) {
          bestInNavScore = score;
          bestInNav = candidate;
        }
        continue;
      }
      if (score < bestScore) {
        bestScore = score;
        best = candidate;
      }
    }
    if (best) {
      return best;
    }
    return bestInNav;
  }

  // After the focus was lost, arrows start from what is on screen, not the section links.
  function controlOnScreen() {
    var all = controls();
    for (var index = 0; index < all.length; index++) {
      var box = boxOf(all[index]);
      if (!inSectionNav(all[index]) && box.top >= 0 && box.bottom <= window.innerHeight) {
        return all[index];
      }
    }
    return all[0];
  }

  // ---------- keeping the focus when a list is drawn again ----------

  // Where the focus was: a card or switch by its name and value, or a button
  // by its list, its row's key (the app, photo or icon) and its place in the
  // row. Moving an app redraws the list: the focus follows the app.
  var tvFocus = null;

  function rememberFocus(element) {
    if (element.name) {
      tvFocus = { name: element.name, value: element.value };
      return;
    }
    var row = element.closest('li');
    var list = row ? row.parentElement : null;
    if (!row || !list || !list.id) {
      tvFocus = null;
      return;
    }
    var rows = Array.prototype.slice.call(list.children);
    var buttons = Array.prototype.slice.call(row.querySelectorAll('button'));
    tvFocus = { list: list.id, key: row.dataset.key, row: rows.indexOf(row), button: buttons.indexOf(element) };
  }

  function findRemembered() {
    if (tvFocus.name) {
      var inputs = document.querySelectorAll('input[name]');
      for (var index = 0; index < inputs.length; index++) {
        if (inputs[index].name === tvFocus.name && inputs[index].value === tvFocus.value) {
          return inputs[index];
        }
      }
      return null;
    }
    var list = document.getElementById(tvFocus.list);
    if (!list || list.children.length === 0) {
      return null;
    }
    var row = null;
    for (var rowIndex = 0; rowIndex < list.children.length; rowIndex++) {
      if (tvFocus.key && list.children[rowIndex].dataset.key === tvFocus.key) {
        row = list.children[rowIndex];
      }
    }
    // The row is gone (a deleted photo): take the one that moved into its place.
    if (!row) {
      row = list.children[Math.min(tvFocus.row, list.children.length - 1)];
    }
    // The same button in that row, or the nearest one that can be pressed
    // ("earlier" is switched off once an app is first).
    var buttons = row.querySelectorAll('button');
    for (var distance = 0; distance < buttons.length; distance++) {
      var after = buttons[tvFocus.button + distance];
      if (after && isShown(after)) {
        return after;
      }
      var before = buttons[tvFocus.button - distance];
      if (before && isShown(before)) {
        return before;
      }
    }
    return null;
  }

  function restoreFocus() {
    var active = document.activeElement;
    var focusLost = !active || active === document.body || !document.body.contains(active);
    if (!tvFocus || !focusLost) {
      return;
    }
    var element = findRemembered();
    if (element) {
      moveFocus(element);
    }
  }

  function afterRedraw() {
    setTimeout(restoreFocus, 300);
    setTimeout(restoreFocus, 1000);
  }

  // ---------- delete buttons ask for a second OK ----------

  function isArmed(button) {
    return button.dataset.armed === '1';
  }

  function arm(button) {
    button.dataset.armed = '1';
    button.dataset.label = button.textContent;
    button.textContent = t('web.tv.confirm_delete');
    button.classList.add('armed');
    button.addEventListener('blur', function disarm() {
      button.dataset.armed = '';
      button.textContent = button.dataset.label;
      button.classList.remove('armed');
      button.removeEventListener('blur', disarm);
    });
  }

  function moveFocus(element) {
    element.focus({ preventScroll: true });
    var target = element;
    if (element.type === 'radio' || element.type === 'checkbox') {
      target = element.closest('label') || element;
    }
    target.scrollIntoView({ block: 'center', behavior: 'auto' });
  }

  function isTextField(element) {
    if (element.tagName === 'TEXTAREA') {
      return true;
    }
    if (element.tagName !== 'INPUT') {
      return false;
    }
    return ['text', 'url', 'search', 'number'].indexOf(element.type) >= 0;
  }

  // In a text field, left and right move the cursor until it reaches an end.
  function arrowStaysInField(element, key) {
    if (!isTextField(element)) {
      return false;
    }
    if (key === 'ArrowLeft' && element.selectionStart > 0) {
      return true;
    }
    if (key === 'ArrowRight' && element.selectionEnd < element.value.length) {
      return true;
    }
    return false;
  }

  function onArrow(event, active) {
    if (!active || active === document.body) {
      var start = controlOnScreen();
      if (start) {
        moveFocus(start);
      }
      event.preventDefault();
      return;
    }
    if (arrowStaysInField(active, event.key)) {
      return;
    }
    // From the tabs into the page: start at the top of the open tab, not
    // at whatever happens to be level with the tab.
    if (event.key === 'ArrowRight' && inSectionNav(active)) {
      if (active.dataset.tab && active.getAttribute('aria-selected') !== 'true') {
        showTab(active.dataset.tab);
      }
      var first = firstControlOfOpenTab();
      if (first) {
        moveFocus(first);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
    }
    var next = nextControl(active, event.key);
    if (next) {
      moveFocus(next);
    }
    event.preventDefault();
    event.stopPropagation();
  }

  function onOk(event, active) {
    // Holding OK repeats the key: only a fresh press counts.
    if (event.repeat) {
      event.preventDefault();
      return;
    }
    if (active.type === 'radio' || active.type === 'checkbox') {
      rememberFocus(active);
      active.click();
      event.preventDefault();
      afterRedraw();
      return;
    }
    if (active.classList.contains('remove') && !isArmed(active)) {
      arm(active);
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    if (active.tagName === 'BUTTON') {
      // The button's own click handler runs; the list it changes is drawn again.
      rememberFocus(active);
      afterRedraw();
    }
  }

  function onTvKey(event) {
    var active = document.activeElement;
    var arrows = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    if (arrows.indexOf(event.key) >= 0) {
      onArrow(event, active);
      return;
    }
    if (event.key === 'Enter' && active && active !== document.body) {
      onOk(event, active);
    }
  }

  function firstControlOfOpenTab() {
    var tab = tabFromAddress();
    var panels = document.querySelectorAll('.tab-panel');
    var all = controls();
    for (var index = 0; index < all.length; index++) {
      for (var panelIndex = 0; panelIndex < panels.length; panelIndex++) {
        if (panels[panelIndex].dataset.tab === tab && panels[panelIndex].contains(all[index])) {
          return all[index];
        }
      }
    }
    return null;
  }

  // The page is built after it loads: once it is, the focus goes to the first
  // control of the open tab, ready for the remote.
  function showTvStart() {
    var first = firstControlOfOpenTab();
    if (first) {
      first.focus({ preventScroll: true });
    }
  }

  if (IS_TV) {
    document.body.classList.add('tv');
    document.addEventListener('keydown', onTvKey, true);
  }

  function start() {
    applyStaticText();
    applyScheme();
    // The QR code on the TV carries the code: sign in, then drop it from the address bar.
    var params = new URLSearchParams(location.search);
    var codeFromLink = params.get('code');
    if (codeFromLink) {
      history.replaceState(null, '', location.pathname + location.hash);
      signIn(codeFromLink).then(loadAll);
    } else {
      loadAll();
    }
  }

  // The language file comes first: every text on the page is in it.
  fetch('/i18n.json', { credentials: 'same-origin' }).then(json).then(function (strings) {
    STRINGS = strings;
    start();
  }).catch(function () {
    document.body.textContent = 'Can’t reach the TV. Check that this phone is on the home Wi-Fi.';
  });
}());
</script>
</body>
</html>
